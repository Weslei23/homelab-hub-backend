spring:
  application:
    name: homepage-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homepage}
    username: ${DB_USER:homepage}
    password: ${DB_PASSWORD:homepage}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Primeiro administrador: se o e-mail ja existe vira ADMIN; se nao existe, e criado com a senha abaixo.
  admin:
    email: ${ADMIN_EMAIL:}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

security:
  secret-key: ${JWT_SECRET:chave-temporaria-para-desenvolvimento}