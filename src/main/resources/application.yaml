spring:
  application:
    name: homepage-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homepage}
    username: ${DB_USER:homepage}
    password: ${DB_PASSWORD:homepage}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    # Origens permitidas (separadas por virgula). Em dev o Vite usa proxy, entao nem e necessario.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
