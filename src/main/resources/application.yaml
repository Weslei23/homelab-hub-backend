spring:
  application:
    name: homepage-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homepage}
    username: ${DB_USER:homepage}
    password: ${DB_PASSWORD:homepage}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # Cadastro publico (tela "Criar conta"). Desligado: contas novas so pelo admin.
    registration-enabled: ${REGISTRATION_ENABLED:false}
    # Limite contra tentativa e erro de senhas: N erros na janela bloqueiam o IP e o e-mail
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_WINDOW:15m}
  # Administrador: se o e-mail nao existe, e criado com a senha abaixo; se ja existe, vira ADMIN e,
  # com ADMIN_PASSWORD definido, recebe essa senha a cada inicializacao (troque a senha pela credencial do Jenkins).
  admin:
    email: ${ADMIN_EMAIL:}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  # Verificacao periodica de online/offline dos cards (resultado fica em memoria)
  status:
    interval: ${STATUS_INTERVAL:30s}
    timeout: ${STATUS_TIMEOUT:3s}
    # Aceita certificados autoassinados, comuns em homelab
    insecure-tls: ${STATUS_INSECURE_TLS:true}
  # Avisos de queda/retorno no Discord. Sem webhook = desativado.
  notify:
    failure-threshold: ${NOTIFY_FAILURE_THRESHOLD:2}
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL:}
      username: ${DISCORD_USERNAME:Homelab Hub}
  # Downloads de musica pelo Downtify. Sem DOWNTIFY_URL o painel de musicas fica escondido.
  downtify:
    url: ${DOWNTIFY_URL:}
    # Token de dispositivo do Downtify (dtfy_...). Vazio se o Downtify roda com DOWNTIFY_DISABLE_AUTH=true.
    token: ${DOWNTIFY_TOKEN:}
    # Playlists grandes demoram para resolver
    timeout: ${DOWNTIFY_TIMEOUT:60s}
    # De quanto em quanto tempo as playlists acompanhadas sao conferidas
    sync-interval: ${DOWNTIFY_SYNC_INTERVAL:6h}
  # Painel de filmes e series. Cada servico sem URL fica de fora; sem nenhum, o painel se esconde.
  # As API keys ficam em Settings > General (Sonarr/Radarr) e Painel > Chaves de API (Jellyfin).
  media:
    timeout: ${MEDIA_TIMEOUT:15s}
    # Perfil de qualidade usado nos pedidos (se nao existir, usa o primeiro do Sonarr/Radarr)
    quality-profile: ${MEDIA_QUALITY_PROFILE:HD-1080p}
    sonarr:
      url: ${SONARR_URL:}
      api-key: ${SONARR_API_KEY:}
    radarr:
      url: ${RADARR_URL:}
      api-key: ${RADARR_API_KEY:}
    jellyfin:
      url: ${JELLYFIN_URL:}
      api-key: ${JELLYFIN_API_KEY:}

# Swagger (/swagger-ui.html e /v3/api-docs): ligado no desenvolvimento, desligado em producao (compose.prod.yaml)
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

security:
  secret-key: ${JWT_SECRET:chave-temporaria-para-desenvolvimento}